# ============================================================
# 공통 설정 (모든 프로파일)
# 비밀값은 환경변수로만 주입한다. 이 파일에 실제 비밀값을 적지 않는다.
# ============================================================
spring:
  application:
    name: what-to-cook
  profiles:
    default: local

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # 스키마는 Flyway 마이그레이션으로만 관리한다.
    properties:
      hibernate:
        default_batch_fetch_size: 100
        jdbc:
          time_zone: UTC

  ai:
    retry:
      max-attempts: 1      # Spring AI 자체 재시도는 끄고 Resilience4j(resilience4j.retry.openai) 한 곳에서만 재시도한다.
      on-http-codes: 429   # 429는 기본으로 비일시 오류라 일시 오류(TransientAiException)로 분류해 재시도 대상에 넣는다.

  jackson:
    time-zone: Asia/Seoul
    default-property-inclusion: non_null

server:
  shutdown: graceful
  servlet:
    encoding:
      force: true

springdoc:
  swagger-ui:
    operations-sorter: method
    tags-sorter: alpha
  default-produces-media-type: application/json

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

# LLM 호출 격리 설정 (F2 기타 추천)
resilience4j:
  circuitbreaker:
    instances:
      openai:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        slow-call-duration-threshold: 10s
        slow-call-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
  retry:
    instances:
      openai:
        max-attempts: 3
        wait-duration: 500ms
        enable-exponential-backoff: true   # 500ms → 1s
        exponential-backoff-multiplier: 2
        # 일시 오류(5xx·429·네트워크)만 재시도한다. 4xx·타임아웃·서킷 오픈은 재시도하지 않는다.
        retry-exceptions:
          - org.springframework.ai.retry.TransientAiException
          - org.springframework.web.client.ResourceAccessException
  timelimiter:
    instances:
      openai:
        timeout-duration: 30s
        cancel-running-future: true

app:
  cors:
    allowed-origins: http://localhost:5173
  jwt:
    access-token-validity: 30m
    refresh-token-validity: 14d
  storage:
    # 클라이언트가 직접 올리는 Presigned PUT URL. 짧게 둬서 유출돼도 재사용 시간을 줄인다.
    presign-expiry: 5m
    max-file-size: 5MB
  report:
    hide-threshold: 5   # 누적 신고 수가 이 값에 이르면 레시피·댓글을 숨긴다.
  like:
    strategy: redis        # redis(Redis 원자 연산, 기본) | lock(비관적 락). 부하 테스트 비교용 전환 스위치
    flush-interval: PT10S  # redis 방식에서 모은 카운트를 DB(recipe.like_count)에 반영하는 주기
  recommendation:
    # 정렬 점수 = 일치율 × match-weight + 취향 점수 × taste-weight + 인기도 × popularity-weight (각 점수 0~1)
    match-weight: 0.6
    taste-weight: 0.25
    popularity-weight: 0.15
    candidate-limit: 200   # 일치율 상위 후보만 DB에서 가져와 점수를 매긴다(후보군 사전 축소).
  ai:
    pool-size: 4           # LLM 호출 전용 스레드 수 (웹 요청 스레드와 격리)
    queue-capacity: 50     # 스레드가 모두 바쁠 때 대기할 작업 수. 넘치면 429
    job-ttl: PT10M         # 폴링용 작업 상태 보관 시간 (Redis)

---
# ============================================================
# local: docker-compose(PostgreSQL, Redis)로 띄운 로컬 개발 환경
# ============================================================
spring:
  config:
    activate:
      on-profile: local

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:whattocook}
    username: ${DB_USERNAME:whattocook}
    password: ${DB_PASSWORD:whattocook}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  jpa:
    properties:
      hibernate:
        format_sql: true

  ai:
    openai:
      # 실제 호출이 필요할 때만 OPENAI_API_KEY를 설정한다. 기본값으로는 호출이 실패한다.
      api-key: ${OPENAI_API_KEY:local-placeholder-key}

app:
  jwt:
    # 로컬 전용 기본값. 운영에서는 반드시 JWT_SECRET 환경변수로 32바이트 이상 임의 값을 넣는다.
    secret: ${JWT_SECRET:local-only-jwt-secret-change-me-0123456789}
  storage:
    # docker-compose의 S3 호환 스토리지(SeaweedFS). 키 기본값은 로컬 전용이며 docker-compose와 같은 값을 쓴다.
    endpoint: ${STORAGE_ENDPOINT:http://localhost:9000}
    region: us-east-1
    bucket: ${STORAGE_BUCKET:whattocook-images}
    access-key: ${STORAGE_ACCESS_KEY:whattocook}
    secret-key: ${STORAGE_SECRET_KEY:whattocook-local}
    public-base-url: ${STORAGE_PUBLIC_BASE_URL:http://localhost:9000/whattocook-images}

management:
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.whattocook: debug
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace

---
# ============================================================
# prod: 모든 접속 정보와 비밀값을 환경변수로 받는다 (기본값 없음 → 누락 시 기동 실패)
# ============================================================
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}

  ai:
    openai:
      api-key: ${OPENAI_API_KEY}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  server:
    port: 8081   # 메트릭·헬스체크는 내부 포트로만 노출한다.
  endpoint:
    health:
      show-details: never

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  jwt:
    secret: ${JWT_SECRET}
  storage:
    endpoint: ${STORAGE_ENDPOINT:}   # AWS S3면 비워 둔다.
    region: ${STORAGE_REGION}
    bucket: ${STORAGE_BUCKET}
    access-key: ${STORAGE_ACCESS_KEY:}   # 비우면 IAM 역할 등 AWS 기본 자격 증명을 쓴다.
    secret-key: ${STORAGE_SECRET_KEY:}
    public-base-url: ${STORAGE_PUBLIC_BASE_URL}

logging:
  structured:
    format:
      console: ecs
