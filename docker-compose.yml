# 로컬 개발용 인프라 (PostgreSQL, Redis)
# 사용법: cp .env.example .env && docker compose up -d
services:
  postgres:
    image: postgres:16-alpine
    container_name: whattocook-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-whattocook}
      POSTGRES_USER: ${DB_USERNAME:-whattocook}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-whattocook}
      TZ: Asia/Seoul
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: whattocook-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  redis-data:
